name: Generate contribution snake

on:
  schedule:
    - cron: '17 3 * * *' # Daily at 03:17 UTC (GitHub may delay scheduled runs)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: catseed-snake
  cancel-in-progress: true

jobs:
  snake:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate snake SVG from CatSeed's contributions
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: CatSeed
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-dark&color_snake=lime

      - name: Publish SVG to the output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
